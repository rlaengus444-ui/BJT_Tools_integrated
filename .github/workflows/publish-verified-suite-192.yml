name: Stage exact 1.10.0 CI candidate in existing invisible draft

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-candidate-suite-1.10.0
  cancel-in-progress: false

jobs:
  stage-candidate:
    if: github.repository == 'rlaengus444-ui/BJT_Tools_integrated' && github.ref == 'refs/heads/deliver/ir-suite-1.10.0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed unless every immutable candidate pin is complete
        run: python -c "from release_tools.stage_verified_ir_110 import load_pins; load_pins()"
      - name: Download exact artifact IDs and require outer ZIP bytes and SHA256 before extraction
        env:
          GH_TOKEN: ${{ github.token }}
          BJT_CANDIDATE_ROOT: ${{ runner.temp }}/candidate-110
        run: |
          python release_tools/stage_verified_ir_110.py --archives "$BJT_CANDIDATE_ROOT/archives" --evidence "$BJT_CANDIDATE_ROOT/evidence" --assets "$BJT_CANDIDATE_ROOT/assets" --report "$BJT_CANDIDATE_ROOT/candidate-download-report.json" --download
      - name: Verify exact source evidence and transfer candidate to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          BJT_CANDIDATE_ROOT: ${{ runner.temp }}/candidate-110
        run: |
          python release_tools/stage_verified_ir_110.py --archives "$BJT_CANDIDATE_ROOT/archives" --evidence "$BJT_CANDIDATE_ROOT/evidence" --assets "$BJT_CANDIDATE_ROOT/assets" --report "$BJT_CANDIDATE_ROOT/candidate-staging-report.json" --stage
      - name: Preserve server digest readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BJT-1.10.0-candidate-staging-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate-110/candidate-download-report.json
            ${{ runner.temp }}/candidate-110/candidate-staging-report.json
          if-no-files-found: warn
          retention-days: 7
