name: Read owned frozen IR failure evidence

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact owned failed-run evidence
        uses: actions/download-artifact@v4
        with:
          name: BJT-native-Windows-evidence-44091377811
          run-id: 44091377811
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ir-failure
      - name: Print original test failure and counts
        env:
          IR_EVIDENCE: ${{ runner.temp }}/ir-failure
        run: |
          python - <<'PYCODE'
          import json,os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path(os.environ['IR_EVIDENCE'])
          print('FILES:', ', '.join(sorted(p.name for p in root.iterdir())))
          for name in ('native-summary.json','ir-upstream-tests.json','ir-feedback-exe.json','ir-feedback-cli-exe.json'):
              p=root/name
              if not p.exists():
                  print('MISSING',name)
                  continue
              data=json.loads(p.read_text(encoding='utf-8'))
              print('REPORT',name)
              if name=='native-summary.json':
                  print(json.dumps({k:data.get(k) for k in ('passed','commit','version','checks','traceback')},ensure_ascii=False)[:18000])
              else:
                  print(json.dumps({k:data.get(k) for k in ('passed','tests','failures','errors','skips','runner_error','count_error','failed','errored','skipped','checks','traceback','callback_errors')},ensure_ascii=False)[:24000])
          for p in root.glob('*tests.xml'):
              suites=ET.parse(p)
              cases=list(suites.iter('testcase'))
              print('XML',p.name,json.dumps({'tests':len(cases),'failures':sum(c.find('failure') is not None for c in cases),'errors':sum(c.find('error') is not None for c in cases),'skips':sum(c.find('skipped') is not None for c in cases)}))
          p=root/'ir-upstream-tests.log'
          if p.exists():
              print('ORIGINAL IR LOG TAIL')
              print('\n'.join(p.read_text(encoding='utf-8',errors='replace').splitlines()[-200:])[-24000:])
          PYCODE
