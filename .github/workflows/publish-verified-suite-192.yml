name: Offline IR source view preflight

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Prepare existing pinned image library
        shell: pwsh
        run: python -m pip install --only-binary=:all: --no-deps Pillow==12.3.0
      - name: Exercise isolated source UI and archive flow
        shell: python
        env:
          IR_REPORT: ${{ runner.temp }}/ir-source-preflight.json
        run: |
          import json,os,sys
          from pathlib import Path
          base = Path('suite').resolve()
          sys.path.insert(0, str(base))
          sys.path.insert(0, str(base / '배포_빌드'))
          from frozen_ir_feedback import run
          report = run(base, Path(os.environ['IR_REPORT']))
          assert report['frozen'] is False
          print(json.dumps(report, ensure_ascii=False))
          Path(os.environ['IR_REPORT']).write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          if not report['passed']:
              raise SystemExit(1)
