name: Diagnose native Windows packing renderer

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-probe:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install matching renderer dependencies
        run: |
          python -m pip install --only-binary=:all: -r 'suite/배포_빌드/windows-requirements.txt'
      - name: Record display adapter
        shell: pwsh
        run: Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,VideoProcessor | ConvertTo-Json
      - name: Run isolated renderer probes
        run: python -u verification/preview-progress/probe_windows_renderer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-renderer-probe-${{ github.run_id }}
          path: windows-renderer-probe.json
          if-no-files-found: warn
