name: Publish verified BJT 1.9.0 artifacts
'on':
  push:
    branches: [codex/publish-bjt-1.9.0-verified-20261113]
    paths: [.github/workflows/publish-bjt-190-verified.yml]
permissions:
  contents: read
concurrency:
  group: publish-bjt-1.9.0-verified
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          name: BJT-native-Windows-release-43455530159
          run-id: 43455530159
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}\verified-bjt190\assets
      - uses: actions/download-artifact@v4
        with:
          name: BJT-native-Windows-evidence-43455530159
          run-id: 43455530159
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}\verified-bjt190\evidence
      - name: Validate, upload, download-verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          BJT_ROOT: ${{ runner.temp }}\verified-bjt190
          PYTHONUTF8: '1'
        shell: pwsh
        run: python release_tools/publish_bjt190_verified.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BJT-1.9.0-publication-${{ github.run_id }}
          path: ${{ runner.temp }}\verified-bjt190\publication-report.json
          if-no-files-found: warn
          retention-days: 7
