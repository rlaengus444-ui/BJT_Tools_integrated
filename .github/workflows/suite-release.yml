name: Integrated suite Windows verification and draft release

'on':
  push:
    branches:
      - codex/integrated-suite-1.7.0
      - codex/integrated-suite-1.7.1
      - codex/integrated-suite-1.8.0
      - codex/integrated-packing-policy-1.9.0
  workflow_dispatch:
    inputs:
      upload_private_draft:
        description: 'Upload verified assets to a private draft (private repositories only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: suite-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: suite/배포_빌드/windows-requirements.txt
      - name: Install pinned native Windows dependencies
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: -r 'suite/배포_빌드/windows-requirements.txt'
      - name: Install pinned Windows MSVC Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned offline IR workbook test dependencies
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r 'verification/ir-integration/test-requirements.txt'
      - name: Verify all tools, build genuine EXEs and package checked assets
        env:
          BJT_CI_OUTPUT: ${{ runner.temp }}\bjt-suite-native
        shell: pwsh
        run: |
          python 'suite/배포_빌드/ci_windows_release.py' --output "$env:BJT_CI_OUTPUT"
      - name: Preserve readable failure diagnostics in workflow log
        if: failure()
        env:
          BJT_CI_REPORTS: ${{ runner.temp }}\bjt-suite-native\reports
        shell: python
        run: |
          import json, os
          from pathlib import Path
          root = Path(os.environ['BJT_CI_REPORTS'])
          for name in ('native-summary.json', 'ir-upstream-tests.json'):
              path = root / name
              if not path.is_file():
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              keys = ('passed','version','commit','tests','failures','errors','skips','traceback','runner_error','count_error','failed','errored')
              print(name, json.dumps({key: data[key] for key in keys if key in data}, ensure_ascii=False)[:24000])
          for name in ('source-tests.log','ir-upstream-tests.log','source-capsule-tests.log','build-runner.log','ir-feedback-exe-runner.log'):
              path = root / name
              if path.is_file():
                  print(name, path.read_text(encoding='utf-8', errors='replace')[-16000:])
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BJT-native-Windows-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}\bjt-suite-native\reports
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve complete release files
        uses: actions/upload-artifact@v4
        with:
          name: BJT-native-Windows-release-${{ github.run_id }}
          path: ${{ runner.temp }}\bjt-suite-native\release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload verified assets to a private draft release
        if: inputs.upload_private_draft == true
        env:
          GH_TOKEN: ${{ github.token }}
          BJT_CI_OUTPUT: ${{ runner.temp }}\bjt-suite-native
        shell: pwsh
        run: |
          python 'suite/배포_빌드/ci_windows_release.py' --output "$env:BJT_CI_OUTPUT" --publish-only
