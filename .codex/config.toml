# GPT-6.1 Terra XHigh is the default coding/orchestrator model.
model = "gpt-6.1-terra"
model_reasoning_effort = "xhigh"

[agents]
enabled = true
max_concurrent_threads_per_session = 2
# Keep ordinary helpers inexpensive; Sol is reserved for sol_reviewer.
default_subagent_model = "gpt-6.1-terra"
default_subagent_reasoning_effort = "high"
